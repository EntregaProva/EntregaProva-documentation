site_name: Entrega Prova — Documentação
site_url: https://marcelovitorfilho.github.io/EntregaProva-documentation/
repo_url: https://github.com/marcelovitorfilho/EntregaProva-documentation
repo_name: EntregaProva/EntregaProva-documentation

theme:
  name: material
  language: pt-BR
  palette:
    # Modo Claro
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Alternar para modo escuro
    # Modo Escuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo claro
  features:
    - navigation.top               # Botão flutuante 'Voltar ao topo'
    - navigation.instant           # Carregamento SPA sem recarregar tela inteira
    - navigation.tracking          # Atualiza URL conforme o scroll
    - navigation.tabs              # Abas de categorias no topo
    - navigation.tabs.sticky       # Abas fixas no topo ao rolar
    - navigation.sections          # Agrupamento elegante na barra lateral
    - navigation.expand            # Pastas abertas por padrão
    - search.suggest               # Sugestões inteligentes na busca
    - search.highlight             # Destaque de termos pesquisados
    - content.code.copy            # Botão de copiar código em 1 clique

extra_css:
  - assets/css/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Início: index.md
  - Produto e Negócio:
      - Visão e Escopo: produto/visao-e-escopo.md
      - Personas do Usuário: produto/personas.md
      - Jornadas do Usuário: produto/jornada.md
      - Canvas MVP: produto/canvas-mvp.md
      - Diagrama de Ishikawa: produto/ishikawa.md
      - Backlog e MoSCoW: produto/requisitos-moscow.md
      - Pesquisa e Evidências: produto/pesquisa-e-evidencias.md
      - Exemplos de XML: produto/exemplos-xml.md
  - Gestão e Metodologia:
      - Definition of Done (DoD): gestao/dod.md
  - Qualidade de Software:
      - Estratégia de Testes: qualidade/estrategia-testes.md
  - Arquitetura:
      - ADR 001 - Stack Base: arquitetura/adrs/001-stack-base.md
      - ADR 002 - Modelagem Firestore: arquitetura/adrs/002-modelagem-firestore.md
      - ADR 003 - Parser XML e XXE: arquitetura/adrs/003-parser-xml-xxe.md
      - ADR 004 - Captura Mobile: arquitetura/adrs/004-captura-mobile-idempotencia.md